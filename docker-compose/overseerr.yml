version: '3'
services:
  app:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    init: true
    environment:
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - app:/app/config
      #- www:/app/overseerr/public #rebrand; path likely differs in Seerr, re-check before enabling
    ports:
      - ${WEBPORT:-5055}:5055
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
      - dfgeneric.enable=true
      - dfgeneric.hostname=${SUBDOMAIN}${DOMAIN}
      - dfgeneric.service=http://${HOSTNAME:-localhost}:${WEBPORT:-5055}
      - dfgeneric.access.policy=${CFPOLICY:-bypass}
      - dfgeneric.name=${CFACCESSNAME:-Overseerr}
      - dfgeneric.zonename=${DOMAIN}
      - dfgeneric.path=${URLPATH:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  app:
  #www:
